[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "bot-tower-defense"
version = "0.1.0"
description = "Deterministic two-player bot tower defense and snapshot replay"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
analysis = [
    "pandas>=2.2,<4",
    "notebook>=7,<8",
]

[project.scripts]
td_match = "td_game.runner:main"
td_stats = "td_stats.main:main"
td_view = "td_view.main:main"

[tool.setuptools.packages.find]
include = ["td_game*", "td_bots*", "td_stats*", "td_view*", "data_analysis*", "interview_pathfinding*"]

[tool.setuptools.package-data]
td_game = ["balanced.json"]
